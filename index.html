<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPHIR · Gestionnaire de patrimoine numérique</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0}
:root{--card:#1a1a1a;--line:rgba(255,255,255,.25);--soft:rgba(255,255,255,.10);--mut:#bababa;--txt:#fff;--up:#7fd1a8;--down:#e88f8f;--acc:#a9cdf5;--acc2:#e6c27a}
body{color:var(--txt);font-family:Inter,"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;background:#000;min-height:100vh}
#hbg{position:fixed;inset:0;z-index:-1;background-color:#0c1016;background-image:url("https://trouveemmanuel67-eng.github.io/hub-working/bg-storm.jpg");background-image:image-set(url("https://trouveemmanuel67-eng.github.io/hub-working/bg-storm.webp") type("image/webp"),url("https://trouveemmanuel67-eng.github.io/hub-working/bg-storm.jpg") type("image/jpeg"));background-position:right bottom;background-size:cover}
#hbg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,18,.72),rgba(8,12,18,.55) 40%,rgba(8,12,18,.68))}
#hh{text-align:center;padding:16px 12px 8px}
#hh h1{margin:0 0 4px;font-weight:600;font-size:22px;letter-spacing:.14em;text-transform:uppercase}
#hh .sub{color:var(--mut);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
nav{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:8px}
nav a{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;color:#fff;text-decoration:none;font-size:14px;font-weight:500;border-radius:999px;transition:transform .25s,box-shadow .25s,background-color .25s}
nav a.on{background:rgba(255,255,255,.18);backdrop-filter:blur(12px)}
nav a:not(.off):hover{transform:scale(1.06);box-shadow:0 0 0 1px rgba(210,235,255,.5),0 0 16px rgba(140,200,255,.35);background:rgba(255,255,255,.16)}
nav a.off{color:rgba(255,255,255,.45);cursor:not-allowed}
nav a .soon{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:1px 6px}
main{max-width:1240px;margin:8px auto 0;padding:0 14px 20px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.4);padding:18px 20px;margin-bottom:18px}
.card h2{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.card .desc{color:var(--mut);font-size:13px;margin:4px 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{border:1px solid var(--soft);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.02)}
.kpi .l{font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--mut);margin-top:2px}
.up{color:var(--up)}.down{color:var(--down)}
.chart{position:relative;height:320px}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;white-space:nowrap;border-bottom:1px solid var(--soft);text-align:right}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{color:var(--mut);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--acc2)}
.src{margin-top:14px;padding-top:10px;border-top:1px solid var(--soft);font-size:12px;color:var(--mut);line-height:1.55}
.src a{color:var(--acc)}
.note{font-size:12px;color:var(--mut);border-left:2px solid rgba(230,194,122,.6);padding:4px 10px;margin:10px 0 0}
.gauge{display:flex;height:34px;border-radius:999px;overflow:hidden;border:1px solid var(--line);font-size:12px;font-weight:700}
.gauge div{display:flex;align-items:center;justify-content:center;white-space:nowrap}
.toggle{display:inline-flex;gap:6px;margin:0 0 10px}
.toggle button{background:transparent;color:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.toggle button.on{background:#fff;color:#000}
footer{text-align:center;color:var(--mut);font-size:12px;padding:6px 14px 26px;max-width:1240px;margin:0 auto}
.placeholder{text-align:center;color:var(--mut);padding:50px}
</style>
</head>
<body>
<div id="hbg"></div>
<header id="hh">
  <h1>OPHIR</h1>
  <div class="sub">Gestionnaire de patrimoine numérique · Emmanuel Trouvé</div>
  <nav id="nav"></nav>
</header>
<main id="tabs"></main>
<footer>Données indicatives issues de sources officielles (INSEE, Notaires-INSEE, Observatoire Crédit Logement/CSA, Banque de France, Google Trends). Ne constitue pas un conseil en investissement.</footer>

<script>
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const fmt=(v,d=1)=>v.toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const eur=v=>v.toLocaleString('fr-FR',{maximumFractionDigits:0})+' €';
const sign=(v,d=1)=>(v>0?'+':'')+fmt(v,d);
const cls=v=>v>=0?'up':'down';
const qfr=p=>{const [y,q]=p.split('-');return 'T'+q.slice(1)+' '+y};
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const mfr=p=>{const [y,m]=p.split('-');return MOIS[+m-1]+' '+y};
const dfr=s=>new Date(s).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});

Chart.defaults.color='#bababa';Chart.defaults.borderColor='rgba(255,255,255,.08)';
Chart.defaults.font.family='Inter,"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif';
Chart.defaults.plugins.legend.labels.boxWidth=12;
const charts=[];

/* ===== Registre des onglets : ajouter un onglet = ajouter un objet ici ===== */
const TABS=[
  {id:'immobilier',label:'Immobilier',enabled:true,render:renderImmobilier},
  {id:'actions',label:'Actions',enabled:false},
  {id:'crypto',label:'Crypto',enabled:false},
  {id:'liquidites',label:'Liquidités',enabled:false},
];

function buildTabs(){
  const nav=document.getElementById('nav'),main=document.getElementById('tabs');
  TABS.forEach(t=>{
    const a=document.createElement('a');a.href='#'+t.id;a.id='t'+t.id;a.innerHTML=t.label+(t.enabled?'':' <span class="soon">bientôt</span>');
    if(!t.enabled){a.classList.add('off');a.setAttribute('aria-disabled','true');a.addEventListener('click',e=>e.preventDefault());}
    nav.appendChild(a);
    const s=document.createElement('section');s.className='tab';s.id='p'+t.id;
    if(!t.enabled) s.innerHTML='<div class="card placeholder">Onglet « '+t.label+' » : bientôt disponible.</div>';
    main.appendChild(s);
  });
  window.addEventListener('hashchange',show);show();
}
function show(){
  let id=location.hash.slice(1);let t=TABS.find(x=>x.id===id&&x.enabled)||TABS.find(x=>x.enabled);
  TABS.forEach(x=>{document.getElementById('t'+x.id).classList.toggle('on',x===t);document.getElementById('p'+x.id).classList.toggle('on',x===t);});
  if(t.render&&!t.done){t.render(document.getElementById('p'+t.id));t.done=true;}
}

/* ===== Onglet IMMOBILIER ===== */
function renderImmobilier(el){
  el.innerHTML=blocPrix()+blocTaux()+blocTrends();
  chartPrix();chartTaux();chartTrends();
}

function blocPrix(){
  const P=DATA.prix,L=P.last,e=P.ev;
  const k=(n)=>`<div class="kpi"><div class="l">Évolution ${n} ans</div><div class="v ${cls(e[n].pct)}">${sign(e[n].pct)} %</div><div class="s">depuis ${qfr(e[n].from)} (${fmt(e[n].v0)}) · ${sign(e[n].cagr,2)} %/an</div></div>`;
  return `<div class="card"><h2>Prix des logements anciens · France métropolitaine</h2>
  <div class="desc">Indice Notaires-INSEE, ensemble des logements, base 100 en moyenne 2015, série CVS trimestrielle, ${qfr(P.series[0][0])} → ${qfr(L.period)}.</div>
  <div class="kpis">
   <div class="kpi"><div class="l">Dernière valeur</div><div class="v">${fmt(L.value)}</div><div class="s">${qfr(L.period)}${L.status==='P'?' · provisoire':''}</div></div>
   ${k(25)}${k(10)}${k(5)}
   <div class="kpi"><div class="l">Écart au plus haut</div><div class="v ${cls(P.peak.dd)}">${sign(P.peak.dd)} %</div><div class="s">pic ${fmt(P.peak.value)} au ${qfr(P.peak.period)}</div></div>
  </div>
  <div class="chart"><canvas id="cPrix"></canvas></div>
  <div class="note">Indice nominal, non corrigé de l'inflation. La valeur du dernier trimestre est provisoire et peut être révisée. La série INSEE démarre en ${qfr(P.first_available)} ; l'affichage commence en 2001.</div>
  <div class="src">Source : INSEE, Notaires de France (base BDM) · idbank <a href="https://www.insee.fr/fr/statistiques/serie/${P.idbank}" target="_blank" rel="noopener">${P.idbank}</a> · données brutes via <a href="https://bdm.insee.fr/series/sdmx/data/SERIES_BDM/${P.idbank}" target="_blank" rel="noopener">API SDMX INSEE</a>.<br>Dernière mise à jour INSEE : ${dfr(P.last_update)} · récupéré le ${dfr(DATA.generated.slice(0,10))}. Série longue complémentaire : <a href="https://www.igedd.developpement-durable.gouv.fr/prix-immobilier-evolution-a-long-terme-a1048.html" target="_blank" rel="noopener">IGEDD (J. Friggit)</a>, non intégrée ici.</div></div>`;
}
function chartPrix(){
  const s=DATA.prix.series;
  charts.push(new Chart(document.getElementById('cPrix'),{type:'line',data:{labels:s.map(x=>qfr(x[0])),datasets:[{label:'Indice (base 100 = 2015)',data:s.map(x=>x[1]),borderColor:'#e6c27a',backgroundColor:'rgba(230,194,122,.10)',fill:true,pointRadius:0,borderWidth:2,tension:.2}]},
  options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' Indice : '+fmt(c.parsed.y)}}},scales:{x:{ticks:{maxTicksLimit:13,autoSkip:true}},y:{title:{display:true,text:'base 100 = 2015'}}}}}));
}

function blocTaux(){
  const T=DATA.taux,CL=T.cl,last=T.last,cl=CL.table[CL.table.length-1];
  const rows=T.sim.map(r=>`<tr><td>${r.label}</td><td>${fmt(r.rate,2)} %</td><td>${eur(r.mens)}</td><td>${eur(r.interets)}<div class="bar"><i style="width:${(r.interets/T.sim.reduce((m,x)=>Math.max(m,x.interets),0)*100).toFixed(1)}%"></i></div></td></tr>`).join('');
  return `<div class="card"><h2>Coût du crédit immobilier · taux fixe hors assurance</h2>
  <div class="desc">Taux moyen des crédits nouveaux à l'habitat aux particuliers, taux fixe sur plus de 10 ans, hors assurance, ${mfr(T.series[0][0])} → ${mfr(last[0])}.</div>
  <div class="kpis">
   <div class="kpi"><div class="l">Taux actuel · Crédit Logement/CSA</div><div class="v">${fmt(CL.oct2026,2)} %</div><div class="s">octobre 2026 · ${sign(Math.round((CL.oct2026-CL.sep2026)*100),0)} pdb sur un mois</div></div>
   <div class="kpi"><div class="l">Prêts sur 25 ans · CL/CSA</div><div class="v">${fmt(cl[4],2)} %</div><div class="s">octobre 2026 (15 ans : ${fmt(cl[2],2)} % · 20 ans : ${fmt(cl[3],2)} %)</div></div>
   <div class="kpi"><div class="l">Taux Banque de France</div><div class="v">${fmt(last[1],2)} %</div><div class="s">${mfr(last[0])}${last[2]==='P'?' · provisoire':''}</div></div>
   <div class="kpi"><div class="l">Plus bas / plus haut (BdF)</div><div class="v" style="font-size:20px">${fmt(T.min[1],2)} % · ${fmt(T.max[1],2)} %</div><div class="s">${mfr(T.min[0])} · ${mfr(T.max[0])}</div></div>
  </div>
  <div class="grid2">
   <div><div class="chart"><canvas id="cTaux"></canvas></div></div>
   <div><div style="font-size:12px;color:var(--mut);margin-bottom:6px">Emprunt de 200 000 € sur 25 ans, mensualité constante, hors assurance et frais</div>
    <table><thead><tr><th>Taux de référence</th><th>Taux</th><th>Mensualité</th><th>Intérêts totaux</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>
  <div class="note">Deux mesures différentes. La Banque de France donne le taux effectif au sens étroit (TESE) des crédits nouveaux, y compris les renégociations. Crédit Logement/CSA donne le taux nominal moyen du secteur concurrentiel. Les valeurs 2000-2002 de la série BdF sont des estimations (statut « E »), et il y a une rupture de série en 2015. L'historique Crédit Logement/CSA récupéré ne couvre que décembre 2025 à octobre 2026 ; la courbe sur 25 ans s'appuie donc sur la série BdF. Le calcul utilise la formule d'annuité M = C·i / (1 − (1+i)<sup>−n</sup>), avec i le taux mensuel et n = 300 mois.</div>
  <div class="src">Sources : Banque de France, statistiques des taux d'intérêt MIR, série <a href="https://data.ecb.europa.eu/data/datasets/MIR/${T.key}" target="_blank" rel="noopener">${T.key}</a> (diffusée par le portail BCE, agence source FR2 = Banque de France ; voir aussi <a href="https://webstat.banque-france.fr/" target="_blank" rel="noopener">Webstat</a>), dernière observation ${mfr(last[0])}.<br>L'Observatoire Crédit Logement/CSA, <a href="https://lobservatoire.creditlogement.fr/publications/analyse-marche-immobilier-octobre-2026/" target="_blank" rel="noopener">tableau de bord d'octobre 2026</a> (publié en novembre 2026). Les deux ont été récupérés le ${dfr(DATA.generated.slice(0,10))}.</div></div>`;
}
function chartTaux(){
  const T=DATA.taux,s=T.series,labels=s.map(x=>x[0]);
  const clPts={'2025-12':3.16,'2026-03':3.22,'2026-06':3.25,'2026-09':3.40};
  const clData=labels.map(l=>clPts[l]??null);
  labels.push('2026-10');const bdf=s.map(x=>x[1]);bdf.push(null);clData.push(T.cl.oct2026);
  charts.push(new Chart(document.getElementById('cTaux'),{type:'line',data:{labels:labels.map(mfr),datasets:[
   {label:'Banque de France · fixe > 10 ans',data:bdf,borderColor:'#a9cdf5',backgroundColor:'rgba(169,205,245,.08)',fill:true,pointRadius:0,borderWidth:2,tension:.15},
   {label:'Crédit Logement/CSA · taux moyen',data:clData,borderColor:'#e6c27a',backgroundColor:'#e6c27a',showLine:false,pointRadius:4,pointHoverRadius:6}]},
  options:{maintainAspectRatio:false,spanGaps:false,interaction:{mode:'index',intersect:false},plugins:{tooltip:{callbacks:{label:c=>c.parsed.y==null?'':' '+c.dataset.label+' : '+fmt(c.parsed.y,2)+' %'}}},scales:{x:{ticks:{maxTicksLimit:12}},y:{title:{display:true,text:'%'},ticks:{callback:v=>v+' %'}}}}}));
}

const AK=["achat immobilier","acheter immobilier","acheter maison","acheter appartement"];
const VK=["vente immobilier","vendre immobilier","estimation immobilière","agence immobilière"];
function trendsStats(excl){
  const T=DATA.trends,vk=VK.filter(k=>!excl||k!=='agence immobilière');
  const idx=T.dates.map((d,i)=>i).filter(i=>!T.partial[i]);
  const ga=T.dates.map((d,i)=>AK.reduce((s,k)=>s+T.terms[k][i],0));
  const gv=T.dates.map((d,i)=>vk.reduce((s,k)=>s+T.terms[k][i],0));
  const avg=(l,ix)=>ix.reduce((s,i)=>s+l[i],0)/ix.length;
  const i3=idx.slice(-13),ip=idx.slice(-26,-13);
  return {ga,gv,vk,share12:avg(ga,idx)/(avg(ga,idx)+avg(gv,idx))*100,share3:avg(ga,i3)/(avg(ga,i3)+avg(gv,i3))*100,
    tA:(avg(ga,i3)/avg(ga,ip)-1)*100,tV:(avg(gv,i3)/avg(gv,ip)-1)*100};
}
function blocTrends(){
  const T=DATA.trends;
  return `<div class="card"><h2>Intérêt de recherche · Google Trends France</h2>
  <div class="desc">Volume relatif de recherche hebdomadaire sur les 12 derniers mois (${dfr(T.dates[0])} → ${dfr(T.dates[T.dates.length-1])}). Groupe achat contre groupe vente, sur une échelle commune.</div>
  <div class="toggle" id="trToggle"><button class="on" data-x="0">Vente avec « agence immobilière »</button><button data-x="1">Vente sans « agence immobilière »</button></div>
  <div class="kpis" id="trKpis"></div>
  <div style="margin:0 0 14px"><div style="font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px">Part achat / vente · moyenne sur 12 mois</div><div class="gauge" id="trGauge"></div></div>
  <div class="grid2"><div><div class="chart"><canvas id="cTrG"></canvas></div></div><div><div class="chart"><canvas id="cTrT"></canvas></div></div></div>
  <div class="note">Les valeurs Google Trends sont relatives (0-100) et calculées sur un échantillon. Deux requêtes de 5 termes au maximum ont été faites, puis la requête « vente » a été recalée sur la requête « achat » grâce au terme pivot commun « acheter maison » (facteur ×${fmt(T.k,3)}). Les chiffres sont des indices et non des volumes absolus. La semaine en cours, partielle, est exclue des moyennes. « Agence immobilière » est surtout une recherche de navigation et pèse lourd dans le groupe vente : le bouton ci-dessus permet de l'exclure. Les tendances comparent les 13 dernières semaines complètes aux 13 précédentes.</div>
  <div class="src">Source : <a href="https://trends.google.com/trends/explore?date=today%2012-m&geo=FR&q=achat%20immobilier,acheter%20immobilier,acheter%20maison,acheter%20appartement" target="_blank" rel="noopener">Google Trends, groupe achat</a> · <a href="https://trends.google.com/trends/explore?date=today%2012-m&geo=FR&q=vente%20immobilier,vendre%20immobilier,estimation%20immobili%C3%A8re,agence%20immobili%C3%A8re,acheter%20maison" target="_blank" rel="noopener">groupe vente + pivot</a> (géo : France, 12 derniers mois). Récupéré le ${dfr(T.retrieved.slice(0,10))} à ${T.retrieved.slice(11)} (heure de Paris) via pytrends.</div></div>`;
}
let trG,trT;
function chartTrends(){
  const T=DATA.trends,labels=T.dates.map(d=>new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}));
  trG=new Chart(document.getElementById('cTrG'),{type:'line',data:{labels,datasets:[
    {label:'Achat (somme 4 termes)',data:[],borderColor:'#7fd1a8',pointRadius:0,borderWidth:2,tension:.25},
    {label:'Vente (somme)',data:[],borderColor:'#e88f8f',pointRadius:0,borderWidth:2,tension:.25}]},
    options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{title:{display:true,text:'Achat vs vente (indice recalé)'}},scales:{x:{ticks:{maxTicksLimit:8}},y:{beginAtZero:true}}}});
  const pal=['#7fd1a8','#5fb38b','#a6e3c6','#3d8f68','#e88f8f','#c96f6f','#f2b6b6','#a94f4f'];
  trT=new Chart(document.getElementById('cTrT'),{type:'line',data:{labels,datasets:[...AK,...VK].map((k,i)=>({label:k,data:T.terms[k],borderColor:pal[i],pointRadius:0,borderWidth:1.5,tension:.25,borderDash:i>=4?[4,3]:[]}))},
    options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{title:{display:true,text:'Détail par terme'},legend:{labels:{font:{size:10}}}},scales:{x:{ticks:{maxTicksLimit:6}},y:{beginAtZero:true}}}});
  charts.push(trG,trT);
  const upd=(excl)=>{
    const s=trendsStats(excl);
    trG.data.datasets[0].data=s.ga.map(v=>+v.toFixed(1));trG.data.datasets[1].data=s.gv.map(v=>+v.toFixed(1));
    trG.data.datasets[1].label='Vente (somme '+s.vk.length+' termes)';trG.update();
    trT.data.datasets.forEach(d=>d.hidden=excl&&d.label==='agence immobilière');trT.update();
    document.getElementById('trKpis').innerHTML=
     `<div class="kpi"><div class="l">Part de l'achat · 12 mois</div><div class="v">${fmt(s.share12,0)} %</div><div class="s">vente : ${fmt(100-s.share12,0)} %</div></div>
      <div class="kpi"><div class="l">Part de l'achat · 3 derniers mois</div><div class="v">${fmt(s.share3,0)} %</div><div class="s">${sign(s.share3-s.share12)} pt contre 12 mois</div></div>
      <div class="kpi"><div class="l">Tendance achat (13 sem.)</div><div class="v ${cls(s.tA)}">${sign(s.tA)} %</div><div class="s">contre les 13 semaines précédentes</div></div>
      <div class="kpi"><div class="l">Tendance vente (13 sem.)</div><div class="v ${cls(s.tV)}">${sign(s.tV)} %</div><div class="s">contre les 13 semaines précédentes</div></div>`;
    document.getElementById('trGauge').innerHTML=`<div style="width:${s.share12}%;background:rgba(127,209,168,.85);color:#000">Achat ${fmt(s.share12,0)} %</div><div style="width:${100-s.share12}%;background:rgba(232,143,143,.85);color:#000">Vente ${fmt(100-s.share12,0)} %</div>`;
  };
  document.querySelectorAll('#trToggle button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#trToggle button').forEach(x=>x.classList.toggle('on',x===b));upd(b.dataset.x==='1');}));
  upd(false);
}
buildTabs();
</script>
