/* ===== Onglet Placements ===== */
.plc-colh{display:grid;grid-template-columns:minmax(110px,.8fr) minmax(0,1.6fr) auto auto;gap:8px 16px;padding:0 12px 8px;font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.plc-list{display:flex;flex-direction:column;gap:6px}
.plc-row{display:grid;grid-template-columns:minmax(110px,.8fr) minmax(0,1.6fr) auto auto;gap:8px 16px;align-items:baseline;padding:10px 12px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(255,255,255,.03);font-variant-numeric:tabular-nums}
.plc-et{color:var(--mut);font-size:13px}
.plc-nm{font-weight:650;min-width:0}
.plc-solde{justify-self:end;font-size:16px;font-weight:700;white-space:nowrap}
.plc-taux{justify-self:end;color:var(--acc2);white-space:nowrap;font-size:13px}
.plc-tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding:8px 12px 0;border-top:1px solid var(--soft);font-variant-numeric:tabular-nums}

.plc-tot b{font-size:16px}
@media(max-width:640px){
  .plc-colh{display:none}
  .plc-row{grid-template-columns:1fr auto;grid-template-areas:"et taux" "nm solde";gap:2px 12px;padding:10px 12px}
  .plc-et{grid-area:et;font-size:12px}
  .plc-nm{grid-area:nm}
  .plc-solde{grid-area:solde}
  .plc-taux{grid-area:taux;font-size:12px}
}

/* ===== En-têtes et jauge compactés (tous les onglets) ===== */
.card.acc{padding:4px 10px;margin-bottom:2px;border-radius:8px;transition:border-color .15s,background-color .15s,transform .15s,padding .15s}
.card.acc.acc-open{padding:12px 16px;margin-bottom:10px}
.card.acc:not(.acc-open):hover{border-color:rgba(230,194,122,.55);background:rgba(230,194,122,.06);transform:translateX(2px)}
.card.acc:not(.acc-open) .desc{margin:0}
.acc-head:has(.acc-line){display:grid;grid-template-columns:14px minmax(7.2rem,1.05fr) minmax(6.4rem,0.9fr) 6.2rem minmax(6.2rem,1fr) minmax(5.2rem,0.85fr) 3rem;align-items:center;column-gap:8px;min-height:28px}
.acc-head.acc-has-note:has(.acc-line){grid-template-columns:14px minmax(6.4rem,0.85fr) auto minmax(5.8rem,0.8fr) 6.2rem minmax(5.6rem,1fr) minmax(4.8rem,0.75fr) 3rem;min-height:44px;column-gap:10px}
.acc-head.acc-has-note .al-note{display:flex;align-items:baseline;gap:.22em;line-height:1;margin:0;padding:0 2px 0 0}

.acc-head.acc-has-note .al-note small{font-size:.9rem;font-weight:650;opacity:.92}
.acc-head.acc-has-note .al{font-size:12px}
@media(max-width:600px){.acc-head.acc-has-note .al-note b{font-size:1.7rem}}
.acc-head:has(.acc-line) h2{display:contents;font-size:12px;letter-spacing:.06em}
.acc-head:has(.acc-line) .acc-tt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
.acc-head:has(.acc-line) .acc-key{display:none}
.acc-head:has(.acc-line) .acc-chev{grid-column:1;width:14px}
.acc-line{display:contents}
.al{font-size:12.5px;color:#d8d0c2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-variant-numeric:tabular-nums}
.al.is-empty{color:var(--mut)}

.al-dots{display:flex;align-items:center;gap:7px;color:#d8d0c2;font-size:12.5px}

.al-dots .g{background:#7fd1a8}.al-dots .o{background:#ff9a1f}.al-dots .r{background:#e88f8f}
.al-warn{color:#ffb347;font-weight:650}

.acc-group>.acc-head:has(.acc-line) h2,.acc-group>.acc-head:has(.acc-line) .acc-tt{font-size:12px;letter-spacing:.06em}

<script>
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const fmt=(v,d=1)=>(v==null||v===''||Number.isNaN(Number(v)))?'–':Number(v).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pw=p=>{const v=Math.round(p*10000)/100;return fmt(v,Number.isInteger(v)?0:(Number.isInteger(Math.round(v*100)/10)?1:2));};
const eur=v=>v.toLocaleString('fr-FR',{maximumFractionDigits:0})+' €';
const sign=(v,d=1)=>(v==null||v===''||Number.isNaN(Number(v)))?'–':((v>0?'+':'')+fmt(v,d));
const cls=v=>v>=0?'up':'down';

function apexPlain(s){
  if(!s) return '';
  return String(s)
    .replace(/Indicateur composite APEX, purement informati[fv]e?\.\s*/gi,'')
    .replace(/Sélection quantitative APEX, purement informati[fv]e?\.\s*/gi,'')
    .replace(/Indice composite APEX, pas un indice officiel\.\s*/gi,'')
    .replace(/Indice composite APEX, non officiel,\s*/gi,'Indice composite APEX, ')
    .replace(/Indices composites APEX, pas des indices officiels(?:\s*·\s*)?/gi,'')
    .replace(/Ce n['\u2019]est ni un conseil ni un signal d['\u2019]ordre\.\s*/gi,'')
    .replace(/Ne constitue pas un conseil ni [^.]*\.\s*/gi,'')
    .replace(/Aucun rendement n['\u2019]est promis\.\s*/gi,'')
    .replace(/Les lectures d['\u2019]Elliott[^.]*TradingView\.\s*/gi,'')
    .replace(/Les lectures d['\u2019]Elliott, de Fibonacci et de la charte sont automatiques et peuvent différer de TradingView\.\s*/gi,'')
    .replace(/Décompte approximatif, il peut différer de ton indicateur TradingView\.\s*/gi,'')
    .replace(/approximation qui peut différer de ton indicateur TradingView\.\s*/gi,'')
    .replace(/, qui peut différer de ton indicateur TradingView/gi,'')
    .replace(/Les prévisions d['\u2019]analystes peuvent se révéler fausses\.\s*/gi,'')
    .replace(/Les scores techniques peuvent se tromper lors des retournements\.\s*/gi,'')
    .replace(/On n['\u2019]entre jamais sur un plus haut historique\.\s*/gi,'')
    .replace(/  +/g,' ')
    .replace(/ \./g,'.')
    .trim();
}

const qfr=p=>{const [y,q]=p.split('-');return 'T'+q.slice(1)+' '+y};
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const mfr=p=>{const [y,m]=p.split('-');return MOIS[+m-1]+' '+y};
const dfr=s=>new Date(s).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});

Chart.defaults.color='#bababa';Chart.defaults.borderColor='rgba(255,255,255,.08)';
Chart.defaults.font.family='Inter,"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif';
Chart.defaults.plugins.legend.labels.boxWidth=12;
const charts=[];

/* ===== Registre des onglets : ajouter un onglet = ajouter un objet ici ===== */
const TABS=[
  {id:'accueil',label:'Accueil',enabled:true,render:el=>renderAccueil(el)},
  {id:'actions',label:'Actions',enabled:true,render:el=>renderActions(el)},
  {id:'obligations',label:'Obligations',enabled:true,render:el=>renderObligations(el)},
  {id:'metaux',label:'Métaux précieux',enabled:true,render:el=>renderMetaux(el)},
  {id:'energie',label:'Énergie',enabled:true,render:el=>renderEnergie(el)},
  {id:'crypto',label:'Crypto',enabled:true,render:el=>renderCrypto(el)},
  {id:'liquidites',label:'Liquidités',enabled:true,render:el=>renderLiquidites(el)},
  {id:'placements',label:'Placements',enabled:true,render:el=>renderPlacements(el)},
  {id:'immobilier',label:'Immobilier',enabled:true,render:renderImmobilier},
];

function buildTabs(){
  const nav=document.getElementById('nav'),main=document.getElementById('tabs');
  TABS.forEach(t=>{
    const a=document.createElement('a');a.href='#'+t.id;a.id='t'+t.id;a.innerHTML=t.label+(t.enabled?'':' <span class="soon">bientôt</span>');
    if(!t.enabled){a.classList.add('off');a.setAttribute('aria-disabled','true');a.addEventListener('click',e=>e.preventDefault());}
    nav.appendChild(a);
    const s=document.createElement('section');s.className='tab';s.id='p'+t.id;
    if(!t.enabled) s.innerHTML='<div class="card placeholder">Onglet « '+t.label+' » : bientôt disponible.</div>';
    main.appendChild(s);
  });
  window.addEventListener('hashchange',show);show();
}
function show(){
  if(!location.hash){try{history.replaceState(null,'',location.pathname+location.search+'#accueil');}catch(e){location.hash='accueil';}}
  let id=location.hash.slice(1);
  const isRegles=id==='regles'||id.indexOf('regles-')===0||id.indexOf('regles/')===0;
  if(isRegles) id=(typeof rgPrevTab==='string'&&rgPrevTab&&rgPrevTab!=='regles')?rgPrevTab:'accueil';
  let t=TABS.find(x=>x.id===id&&x.enabled)||TABS.find(x=>x.enabled);
  TABS.forEach(x=>{document.getElementById('t'+x.id).classList.toggle('on',x===t);document.getElementById('p'+x.id).classList.toggle('on',x===t);});
  document.body.classList.toggle('home-on',t.id==='accueil');
  const accAllBtn=document.getElementById('accAll');if(accAllBtn)accAllBtn.hidden=(t.id==='accueil');
  if(t.render&&!t.done){t.render(document.getElementById('p'+t.id));t.done=true;}
  {const du=document.getElementById('duo');if(du)du.innerHTML='';}   /* évite les id de canvas en double avant le nouveau rendu */
  if(typeof renderIndicator==='function') renderIndicator(t.id);
  if(typeof renderAchatVente==='function') renderAchatVente(t.id);
  if(typeof accMain==='function'){accMain(document.getElementById('p'+t.id),t.id);duoBuild(t.id);accBtn();}
  if(typeof rgSetOpen==='function'){
    if(isRegles) rgSetOpen(true,{fromHash:true});
    else if(typeof rgIsOpen==='function'&&rgIsOpen()) rgSetOpen(false,{fromHash:true});
  }
}

/* ===== Onglet IMMOBILIER ===== */
function renderImmobilier(el){
  el.innerHTML=blocPrix()+blocTaux()+blocTrends();
  chartPrix();chartTaux();chartTrends();
}

function blocPrix(){
  const P=DATA.prix,L=P.last,e=P.ev;
  const k=(n)=>`<div class="kpi"><div class="l">Évolution ${n} ans</div><div class="v ${cls(e[n].pct)}">${sign(e[n].pct)} %</div><div class="s">depuis ${qfr(e[n].from)} (${fmt(e[n].v0)}) · ${sign(e[n].cagr,2)} %/an</div></div>`;
  return `<div class="card"><h2>Prix des logements anciens · France métropolitaine</h2>
  <div class="desc">Indice Notaires-INSEE, ensemble des logements, base 100 en moyenne 2015, série CVS trimestrielle, ${qfr(P.series[0][0])} → ${qfr(L.period)}.</div>
  <div class="kpis">

   <div><div class="chart"><canvas id="cTaux"></canvas></div></div>

const AK=["achat immobilier","acheter immobilier","acheter maison","acheter appartement"];
const VK=["vente immobilier","vendre immobilier","estimation immobilière","agence immobilière"];
function trendsStats(excl){
  const T=DATA.trends,vk=VK.filter(k=>!excl||k!=='agence immobilière');
  const idx=T.dates.map((d,i)=>i).filter(i=>!T.partial[i]);
  const ga=T.dates.map((d,i)=>AK.reduce((s,k)=>s+T.terms[k][i],0));
  const gv=T.dates.map((d,i)=>vk.reduce((s,k)=>s+T.terms[k][i],0));
  const avg=(l,ix)=>ix.reduce((s,i)=>s+l[i],0)/ix.length;
  const i3=idx.slice(-13),ip=idx.slice(-26,-13);
  return {ga,gv,vk,share12:avg(ga,idx)/(avg(ga,idx)+avg(gv,idx))*100,share3:avg(ga,i3)/(avg(ga,i3)+avg(gv,i3))*100,
    tA:(avg(ga,i3)/avg(ga,ip)-1)*100,tV:(avg(gv,i3)/avg(gv,ip)-1)*100};
}

let trG,trT;
function chartTrends(){
  const T=DATA.trends,labels=T.dates.map(d=>new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}));
  trG=new Chart(document.getElementById('cTrG'),{type:'line',data:{labels,datasets:[

  trT=new Chart(document.getElementById('cTrT'),{type:'line',data:{labels,datasets:[...AK,...VK].map((k,i)=>({label:k,data:T.terms[k],borderColor:pal[i],pointRadius:0,borderWidth:1.5,tension:.25,borderDash:i>=4?[4,3]:[]}))},

  charts.push(trG,trT);
  const upd=(excl)=>{
    const s=trendsStats(excl);
    trG.data.datasets[0].data=s.ga.map(v=>+v.toFixed(1));trG.data.datasets[1].data=s.gv.map(v=>+v.toFixed(1));
    trG.data.datasets[1].label='Vente (somme '+s.vk.length+' termes)';trG.update();
    trT.data.datasets.forEach(d=>d.hidden=excl&&d.label==='agence immobilière');trT.update();
    document.getElementById('trKpis').innerHTML=
     `<div class="kpi"><div class="l">Part de l'achat · 12 mois</div><div class="v">${fmt(s.share12,0)} %</div><div class="s">vente : ${fmt(100-s.share12,0)} %</div></div>

      <div class="kpi"><div class="l">Tendance achat (13 sem.)</div><div class="v ${cls(s.tA)}">${sign(s.tA)} %</div><div class="s">contre les 13 semaines précédentes</div></div>
      <div class="kpi"><div class="l">Tendance vente (13 sem.)</div><div class="v ${cls(s.tV)}">${sign(s.tV)} %</div><div class="s">contre les 13 semaines précédentes</div></div>`;
    document.getElementById('trGauge').innerHTML=`<div style="width:${s.share12}%;background:rgba(127,209,168,.85);color:#000">Achat ${fmt(s.share12,0)} %</div><div style="width:${100-s.share12}%;background:rgba(232,143,143,.85);color:#000">Vente ${fmt(100-s.share12,0)} %</div>`;
  };
  document.querySelectorAll('#trToggle button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#trToggle button').forEach(x=>x.classList.toggle('on',x===b));upd(b.dataset.x==='1');}));
  upd(false);
}

<script>
function apexShowMaj(){
  try{
    var el=document.getElementById('dataMaj');
    if(!el) return;
    var j=JSON.parse(el.textContent||'null');
    if(!j||!j.label) return;
    var n=document.getElementById('apex-maj');
    if(!n){
      n=document.createElement('div');
      n.id='apex-maj';
      var host=document.querySelector('#hh .hh-top')||document.getElementById('hh')||document.body;
      host.appendChild(n);
    }
    n.textContent='Mise à jour : '+j.label;
    n.setAttribute('title','Dernière mise à jour des notes APEX (heure de Paris)');
    window.__APEX_MAJ_LABEL=j.label;
    apexStampFiches(document);
  }catch(e){}
}
function apexStampFiches(root){
  var lab=window.__APEX_MAJ_LABEL;
  if(!lab) return;
  (root||document).querySelectorAll('.src').forEach(function(s){
    var n=s.querySelector('.fiche-maj');
    if(!n){
      n=document.createElement('div');
      n.className='fiche-maj';
      s.appendChild(n);
    }
    n.textContent='Mise à jour : '+lab;
  });
}
if(!window.__APEX_MAJ_OBS){
  window.__APEX_MAJ_OBS=true;
  document.addEventListener('DOMContentLoaded', function(){
    apexShowMaj();
    try{
      new MutationObserver(function(muts){
        muts.forEach(function(m){
          m.addedNodes&&m.addedNodes.forEach(function(n){
            if(n.nodeType===1) apexStampFiches(n);
          });
        });
      }).observe(document.body,{childList:true,subtree:true});
    }catch(e){}
  });
}
</script>
